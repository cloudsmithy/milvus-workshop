name: Build Markdown Ebook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install nbconvert jupyter
      
      - name: Convert notebooks to Markdown
        run: |
          for chapter in ch1 ch2 ch3 ch4; do
            if [ -d "$chapter" ]; then
              for notebook in "$chapter"/*.ipynb; do
                if [ -f "$notebook" ]; then
                  jupyter nbconvert --to markdown "$notebook"
                fi
              done
            fi
          done
      
      - name: Copy assets
        run: |
          # Copy image folders that may be referenced by markdown
          cp -r ch1/ch1_1_files ch1/ 2>/dev/null || true
          cp -r ch3/milvus_image_search_data ch3/ 2>/dev/null || true
          cp -r ch3/docs ch3/ 2>/dev/null || true
          cp -r ch4/images ch4/ 2>/dev/null || true
          cp -r ch4/tutorial-yaml ch4/ 2>/dev/null || true
      
      - name: Deploy to ebook branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: ebook
          exclude_assets: '.github,_site,.git'
